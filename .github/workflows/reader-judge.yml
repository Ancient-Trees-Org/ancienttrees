name: Reader judge

# A reader's tree gets its verdict minutes after they send it, not at the
# next two-hourly knock (Hidde, 2026-11-17: "should be instant honestly can it
# just trigger a flow??"). Supabase calls GitHub's repository_dispatch when a
# reader sends a tree or a photograph (supabase/reader-judge-trigger.sql);
# this run judges everything waiting and publishes it. The order of work is
# BRIEF_READER_JUDGE.md; the rules are CLAUDE.md's.
#
# Bursts: the run waits ten minutes before it starts, and the concurrency
# group keeps at most one run waiting behind the running one (GitHub drops
# older pending runs), so a weekend of fifty trees costs a handful of runs,
# not fifty. Revert: delete this file and drop the trigger in Supabase.

on:
  # Every 15 minutes a cheap poll (scripts/reader_poll.py: two id lists, no
  # photographs) asks whether a reader sent anything new; only then does the
  # rest run. Needs nothing from Hidde (2026-11-17). The repository_dispatch
  # below is the optional faster path once the Supabase trigger is pasted.
  schedule:
    - cron: "7,22,37,52 * * * *"
  repository_dispatch:
    types: [reader-tree]
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write
  actions: write

concurrency:
  group: reader-judge
  cancel-in-progress: false

env:
  JUDGE_ALLOWED: "Bash(git:*),Bash(python3:*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(grep:*),Bash(date:*),Bash(curl:*),Bash(mkdir:*),Bash(cp:*),Read,Write,Edit,Glob,Grep,WebSearch,WebFetch"
  JUDGE_DISALLOWED: "Bash(rm:*),Bash(sudo:*),Bash(gh repo:*),Bash(gh secret:*),Bash(gh auth:*),Bash(git clean:*),Bash(git reset --hard:*),Monitor"
  # Judging photographs is judgement work, which stays on Opus (CLAUDE.md
  # "Research": photo-judge runs on Opus by design).
  JUDGE_MODEL: "claude-opus-5-5"

jobs:
  judge:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Let a burst gather
        if: github.event_name == 'repository_dispatch'
        run: sleep 600

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark the starting point
        id: start
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # A reader's mail reply to one of our reader mails (a hold mail's
      # question, the congratulation's "do you know how old it is") becomes a
      # feedback row the judge below picks up (Hidde, 2026-11-18, READER_FLOW.md:
      # "Mail replies first"). Read-only on the mailbox, only senders we mailed
      # and only our reader-mail subjects (scripts/reader_mail_replies.py). The
      # new row is what the poll then sees.
      - name: Readers' mail replies become rows
        continue-on-error: true
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OUTREACH_SMTP_USER: ${{ secrets.OUTREACH_SMTP_USER }}
          OUTREACH_SMTP_PASS: ${{ secrets.OUTREACH_SMTP_PASS }}
        run: |
          python3 scripts/private_store.py pull
          python3 scripts/reader_mail_replies.py --file
          if ! git diff --quiet -- data/mail-replies-seen.json || [ -n "$(git status --porcelain -- data/mail-replies-seen.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/mail-replies-seen.json
            git commit -q -m "reader judge: readers' mail replies filed"
            git pull -q --rebase --autostash origin main && git push -q || true
          fi

      - name: Did a reader send anything new
        id: poll
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || python3 scripts/reader_poll.py; then
            echo "new=yes" >> "$GITHUB_OUTPUT"
          else
            echo "new=no" >> "$GITHUB_OUTPUT"
          fi

      # Readers' photographs survive between runs (2026-11-23). Every run
      # starts on a clean runner, so the intake below fetched every waiting
      # photograph again in full size: 784 downloads of 91 files in one day,
      # 12.5 GB of Supabase's 5 GB free egress in the month. The cache is
      # GitHub's (free); fetch_photo() skips a file already on disk, so each
      # photograph leaves Supabase once. Revert: delete this step and the
      # two at the end of the job.
      - name: Restore readers' photographs from the cache
        id: photocache
        if: steps.poll.outputs.new == 'yes'
        uses: actions/cache/restore@v4
        with:
          path: out/sightings
          key: sightings-restore-only
          restore-keys: sightings-

      - name: Read what readers sent and fetch every waiting photograph
        if: steps.poll.outputs.new == 'yes'
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          pip install --quiet pillow || true
          python3 scripts/sightings_inbox.py
          python3 scripts/fetch_waiting_photos.py
          python3 scripts/judgement.py --scan
          python3 scripts/tree_reports.py --auto
          # A reader's GPS fix moves an approximate pin of ours (move_pin,
          # 2026-10-05) in the same minutes, not at the next knock (Hidde,
          # 2026-11-17: "pin move by reader ook toevoegen aan de reader judge").
          # Arithmetic, no agent: committed here so it lands even when nothing
          # else waits.
          python3 scripts/sightings_publish.py --pins || true
          if ! git diff --quiet -- data/cities; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/cities
            git commit -q -m "reader judge: pins moved to readers' GPS fixes"
            git pull -q --rebase --autostash origin main && git push -q || true
          fi

      # Somebody who pressed "Become the ambassador" gets the mail with the
      # questions and the badge in the same minutes (Hidde, 2026-11-17: "binnen
      # een kwartier mailen in plaats van in de nightrun"). The same script and
      # guards as the knock (one week's rest, mailcheck, send log); the knock
      # still runs it as the safety net and finds nothing left. No agent.
      - name: Answer ambassador requests
        if: steps.poll.outputs.new == 'yes'
        continue-on-error: true
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OUTREACH_SMTP_HOST: ${{ secrets.OUTREACH_SMTP_HOST }}
          OUTREACH_SMTP_PORT: ${{ secrets.OUTREACH_SMTP_PORT }}
          OUTREACH_SMTP_USER: ${{ secrets.OUTREACH_SMTP_USER }}
          OUTREACH_SMTP_PASS: ${{ secrets.OUTREACH_SMTP_PASS }}
          RESEND_SMTP_HOST: ${{ secrets.RESEND_SMTP_HOST }}
          RESEND_SMTP_PASS: ${{ secrets.RESEND_SMTP_PASS }}
          OUTREACH_FROM: ${{ secrets.OUTREACH_FROM }}
        run: |
          python3 scripts/private_store.py pull
          python3 scripts/ambassador.py --requests --send
          python3 scripts/private_store.py push
          if ! git diff --quiet -- data/ambassadors.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/ambassadors.json
            git commit -q -m "reader judge: ambassador requests answered and badged"
            git pull -q --rebase --autostash origin main && git push -q || true
          fi

      - name: Is anything waiting
        id: work
        if: steps.poll.outputs.new == 'yes'
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          leads=$(python3 scripts/fetch_waiting_photos.py --count)
          queue=$(python3 -c "import json;print(len(json.load(open('data/sighting-queue.json')).get('queue',[])))" 2>/dev/null || echo 0)
          reports=$(python3 scripts/tree_reports.py --count 2>/dev/null || echo 0)
          feedback=$(python3 scripts/feedback.py --count 2>/dev/null || echo 0)
          unjudged=$(python3 scripts/judgement.py --count 2>/dev/null || echo 0)
          echo "leads=$leads queue=$queue reports=$reports feedback=$feedback unjudged=$unjudged"
          if [ "$leads" != "0" ] || [ "$queue" != "0" ] || [ "$reports" != "0" ] || [ "$feedback" != "0" ] || [ "$unjudged" != "0" ]; then
            # Never stopped for minutes (Hidde, 2026-11-17: "ik heb liever niet
            # dat die stopt"); scripts/judge_budget.py counts them for the digest.
            echo "go=yes" >> "$GITHUB_OUTPUT"
          else
            echo "go=no" >> "$GITHUB_OUTPUT"
            echo "::notice::Nothing waits for a verdict; no agent started."
          fi

      - name: Judge and publish
        if: steps.work.outputs.go == 'yes'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "github-actions[bot]"
          prompt: |
            Read BRIEF_READER_JUDGE.md in the repository root and do what it
            says, for every reader's tree and photograph waiting for a verdict
            and every open report on one of our trees.
            The intake already ran: the photographs are in out/sightings/.

            Shell style: one command per Bash call. No heredocs, no pipes into
            a second binary, no `&&`, no multi-statement `python3 -c`. Write
            any script to out/tmp/<name>.py with Write and run it. Keep every
            path inside the repository.
          claude_args: |
            --model "${{ env.JUDGE_MODEL }}"
            --allowedTools "${{ env.JUDGE_ALLOWED }}"
            --disallowedTools "${{ env.JUDGE_DISALLOWED }}"
            --max-turns 120

      # The words a reader typed with their tree become their note under it
      # (reader_text_notes.py, Hidde 2026-11-15), now in the same minutes as
      # the tree itself instead of at the next knock (Hidde, 2026-11-17: "die
      # notitie onder de boom ... kan mee in diezelfde judgment"). A script,
      # no agent: it costs nothing when there is nothing to write.
      - name: Readers' words become their note under the tree
        if: steps.work.outputs.go == 'yes'
        continue-on-error: true
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          git pull -q --rebase --autostash origin main || true
          python3 scripts/reader_text_notes.py --write
          if ! git diff --quiet -- data/reader-text-notes.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/reader-text-notes.json
            git commit -q -m "reader judge: readers' words written as their notes"
            git push -q || true
          fi

      # Saved only when the set of files changed, so a run that fetched
      # nothing new uploads nothing. Files untouched for 30 days drop out;
      # one still needed is fetched once more.
      - name: Name the photograph cache
        id: photokey
        if: always() && steps.poll.outputs.new == 'yes'
        run: |
          mkdir -p out/sightings
          find out/sightings -type f -mtime +30 -delete
          echo "key=sightings-$(ls out/sightings | sort | sha1sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Save readers' photographs to the cache
        if: always() && steps.poll.outputs.new == 'yes' && steps.photokey.outputs.key != steps.photocache.outputs.cache-matched-key
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: out/sightings
          key: ${{ steps.photokey.outputs.key }}

      - name: Deploy what went live
        if: steps.work.outputs.go == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch -q origin main
          if [ "$(git rev-parse origin/main)" != "${{ steps.start.outputs.sha }}" ]; then
            gh workflow run deploy.yml --ref main
            echo "::notice::Deploy dispatched for the reader judge's work."
          else
            echo "Nothing of this run's to deploy."
          fi
